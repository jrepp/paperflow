# Each hook calls the same repository entrypoint used by GitHub Actions.
repos:
  - repo: local
    hooks:
      - id: paperflow-security
        name: Credentials and private environment details
        entry: scripts/check security
        language: system
        pass_filenames: false
        always_run: true
      - id: paperflow-lint
        name: Python correctness and bug patterns
        entry: scripts/check lint
        language: system
        pass_filenames: false
        always_run: true
      - id: paperflow-types
        name: Strict types for research domain models
        entry: scripts/check types
        language: system
        pass_filenames: false
        always_run: true
      - id: paperflow-code
        name: Python lockfile, unit and backend acceptance tests
        entry: scripts/check tests
        language: system
        pass_filenames: false
        always_run: true
      - id: paperflow-docs
        name: Docuchango documentation validation
        entry: scripts/check docs
        language: system
        pass_filenames: false
        always_run: true
      - id: paperflow-workflows
        name: GitHub Actions syntax and expressions
        entry: scripts/check workflows
        language: system
        pass_filenames: false
        always_run: true
      - id: paperflow-release
        name: Release versions and package contract
        entry: scripts/check release
        language: system
        pass_filenames: false
        always_run: true
      - id: paperflow-reader
        name: Reader syntax and generated Tailwind CSS
        entry: scripts/check reader
        language: system
        pass_filenames: false
        always_run: true
