[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "paperflow"
version = "0.1.0"
description = "Research paper radar and BOOX sync tooling"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "opentelemetry-api>=1.29,<2",
  "opentelemetry-sdk>=1.29,<2",
  "feedparser>=6.0.11,<7",
  "pydantic>=2.10,<3",
  "pydantic-settings>=2.7,<3",
  "pymupdf4llm>=1.27.2.2",
  "pyyaml>=6.0.3",
  "rich>=13.9.4",
  "textual>=8.2.3",
  "typer>=0.24.1",
  "websockets>=16.0",
  "pydantic-ai-slim[openai,typesafe]>=2.69.0,<3",
  "model2vec>=0.10,<0.11",
  "memvid-sdk==2.0.160",
  "markdown-it-py>=4,<5",
]

[project.optional-dependencies]
telemetry = ["opentelemetry-exporter-otlp-proto-http>=1.29,<2"]
test = [
  "httpx>=0.27,<1",
  "pytest>=8.4.2",
  "testcontainers>=4.13.2",
]

[project.scripts]
paperflow = "paperflow_cli:main"
arxiv-radar = "arxiv_radar_cli:main"
boox-sync = "boox_sync_cli:main"

[tool.setuptools]
packages = ["paperflow_reader", "paperflow_assistant"]
py-modules = [
  "arxiv_radar_cli",
  "boox_sync_cli",
  "booxdrop_cli",
  "paperflow_http",
  "paperflow_build",
  "paperflow_heartbeat",
  "paperflow_api",
  "paperflow_api_client",
  "paperflow_curation",
  "paperflow_curation_api",
  "paperflow_curate_cli",
  "paperflow_monitor",
  "paperflow_monitor_models",
  "paperflow_monitor_store",
  "paperflow_telemetry",
  "paperflow_ingest_models",
  "paperflow_ingestion",
  "paperflow_domain",
  "paperflow_settings",
  "paperflow_story_vectors",
  "paperflow_story_models",
  "paperflow_story_storage",
  "paperflow_topic_models",
  "paperflow_topics",
  "paperflow_topic_api",
  "paperflow_topic_cli",
  "paperflow_storage",
  "paperflow_storage_sqlite",
  "paperflow_cli",
  "paperflow_periodical",
  "paperflow_publish",
  "paperflow_publish_site",
  "paperflow_publish_api",
  "paperflow_ratings",
  "paperflow_radar",
  "paperflow_refresh",
  "paperflow_sources",
  "paperflow_sources_huggingface",
  "paperflow_sources_feed",
  "paperflow_sources_hackernews",
  "paperflow_sources_reddit",
  "paperflow_terminal",
  "radar_db",
]

[dependency-groups]
dev = [
    "actionlint-py==1.7.12.25",
    "docuchango==1.20.0",
    "mypy==1.19.1",
    "pre-commit==4.7.0",
    "ruff==0.15.11",
    "twine==6.2.0",
]

[tool.ruff]
target-version = "py311"
extend-include = ["arxiv-radar", "boox-sync"]
extend-exclude = ["artifacts", "build", "dist", "tex"]

[tool.ruff.lint]
select = ["E9", "F", "B", "PLE", "RUF100"]

[tool.ruff.lint.flake8-bugbear]
# Frameworks inspect these declarative defaults when registering routes and commands.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Path", "typer.Argument", "typer.Option"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
files = [
    "paperflow_assistant/models.py",
    "paperflow_domain.py",
    "paperflow_ingest_models.py",
    "paperflow_monitor_models.py",
    "paperflow_story_models.py",
    "paperflow_topic_models.py",
]

[tool.setuptools.package-data]
paperflow_reader = ["static/*", "static/pdf-assets/**/*"]
paperflow_assistant = ["prompt.txt"]
