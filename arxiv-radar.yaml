output_dir: arxiv-radar-output
storage_root: /storage/emulated/0/Books
lookback_days: 7
recent_limit: 8
cited_limit: 8
citation_candidate_limit: 24
# Local FastAPI service and integration monitor: paperflow serve
research:
  topics:
    enabled: true
    auto_publish: true
    interval_seconds: 900
    window_hours: 24
    min_items: 2
    max_topics: 12
    max_candidates: 2000
  storage:
    adapter: sqlite
    path: artifacts/radar.db
    busy_timeout_seconds: 5
  service:
    host: 127.0.0.1
    port: 8000
  monitor:
    enabled: true
    schedule_enabled: true
    workers: 2
    poll_seconds: 1
    run_timeout_seconds: 600
    retry_seconds: 60
    max_retry_seconds: 3600
    jitter_fraction: 0.1
    jitter_max_seconds: 60
  telemetry:
    service_name: paperflow
    # Override with PAPERFLOW_TELEMETRY__OTLP_ENDPOINT if the Collector is elsewhere.
    otlp_endpoint: http://127.0.0.1:4318
  ingestion:
    channels:
      hackernews:
        url: https://news.ycombinator.com/rss
        discovery: feed
        enrichers: [hackernews]
        kind: discussion
        interval_seconds: 900
        limit: 200
        comment_limit: 3
      lemmy-technology:
        url: https://lemmy.world/feeds/c/technology.xml
        discovery: feed
        kind: discussion
        interval_seconds: 1800
        limit: 200
      mbin:
        url: https://fedia.io/feed?content=threads
        discovery: feed
        kind: discussion
        interval_seconds: 1800
        limit: 200
      tildes-computing:
        url: https://tildes.net/~comp/topics.atom
        discovery: feed
        kind: discussion
        interval_seconds: 1800
        limit: 200
      huggingface-papers:
        url: https://huggingface.co/api/daily_papers
        discovery: huggingface-papers
        kind: paper
        interval_seconds: 1800
        limit: 10
        comment_limit: 0
sources:
  arxiv:
    enabled: true
    strict: true
  huggingface_papers:
    enabled: false
    target_path: AI/Hugging Face Papers
    min_upvotes:
  semantic_scholar:
    enabled: false
    api_key_env: SEMANTIC_SCHOLAR_API_KEY
    categories:
      AI:
        query: "(machine learning OR language models OR agents)"
        target_path: AI/Semantic Scholar
        limit: 50
  paperswithcode:
    enabled: false
    categories:
      AI:
        query: "large language model"
        target_path: AI/Papers with Code
        limit: 50
  manual_links:
    enabled: false
    input_path: artifacts/manual-paper-links.txt
    target_path: AI/Manual imports
export:
  section: all
  categories:
    - AI
    - Data
  exclude_categories: []
  top:
  min_citations: 10
  max_citations:
  since:
  lookback_days: 28
report:
  model: openai/gpt-5.5
  variant:
  title: AI and Data Research Radar Summary
  max_papers:
  summary_cache_dir: artifacts/summary-cache
  markdown_cache_dir: artifacts/markdown-cache
  output_tex: artifacts/arxiv-radar-summary.tex
  output_pdf: artifacts/arxiv-radar-summary.pdf
  build_dir: artifacts/report-build
  prompt_version: 3
periodical:
  series: Research Radar
  issue:
  focus:
  supporting_papers: 6
reference_depth: 0
max_references_per_paper: 10
min_reference_citations: 50
categories:
  AI:
    query: cat:cs.AI OR cat:cs.LG OR cat:cs.CL
    target_path: AI/Research radar
  Data:
    query: cat:cs.DB OR cat:cs.IR OR cat:cs.DC OR cat:stat.AP
    target_path: Data/Research radar
